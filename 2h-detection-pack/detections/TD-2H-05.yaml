id: TD-2H-05
title: "Unusual number of admin password resets by one helpdesk account in a day"
description: >-
  Counts admin password resets per helpdesk account per UTC day and alerts when a day has at least
  3 resets and more than that account's own average for the previous 14 days plus 2. This is a
  campaign-volume rule, not a per-takeover rule: a burst of resets from one account can be the
  start of an attacker campaign or of a compromised helpdesk account.
tables:
  - AuditLogs
attack_technique_ids:
  - TODO(verify)
al26_010_control: "restrict and closely monitor MFA reset, recovery, and device re-enrolment processes"
severity: medium
false_positive_notes: >-
  The limit (more than the account's own 14-day daily average plus 2, and at least 3 that day) is a
  planning value, not a measured one. A genuinely busy day, such as an office-wide password expiry,
  would trigger it, but an agent whose usual volume is high does not (the average rises with it).
  Until a data set holds 14 days of history for an agent (the first week or more), its normal days can look like bursts. It returns one row per reset in the burst, so benign resets in the same burst appear
  too. The generator that made the fixtures has no campaigns, so this rule is tested on synthetic
  data (test_2h_detections_synthetic.py); on the fixtures it happens to return three resets by one
  agent on 15 September, which is not required and not relied on.
expected_hits: []

id: TD-2H-01
title: "Admin password reset followed by a new MFA method within 24 hours"
description: >-
  Finds users whose password was reset by an administrator and who then registered a new multi-factor authentication (MFA) method within 24 hours. This is the first two steps of the helpdesk-reset takeover chain, so it is a broad early warning rather than a verdict.
tables:
  - AuditLogs
attack_technique_ids:
  - TODO(verify)
al26_010_control: "restrict and closely monitor MFA reset, recovery, and device re-enrolment processes"
severity: low
false_positive_notes: >-
  This is a deliberately broad early-warning rule, so it is noisy by design. A genuine lost-phone
  case (LA1: Katya Hashemi, reset after a callback, new MFA method 20 minutes later) returns a row,
  because a verified reset followed by a new MFA method looks identical to a takeover on these two
  signals alone. TD-2H-02, TD-2H-04 and TD-2H-06 do the separating (new device, full chain,
  missing callback note). LA2 and LA3 have no new MFA method, so they stay quiet.
expected_hits: [TK1, TK2]
expected_quiet: [LA2, LA3]
expected_noise: [LA1]
expected_noise_reason: >-
  LA1 is a verified lost-phone reset followed by a new MFA method; on these two signals alone it is
  indistinguishable from a takeover. It is allowed to appear (neither required nor forbidden) and is
  separated from the takeovers by TD-2H-02, TD-2H-04 and TD-2H-06.
